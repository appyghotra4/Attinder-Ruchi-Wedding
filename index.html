<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#400915"><title>Attinder P Singh & Ruchi Kairem | Wedding Invitation</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cinzel:wght@400;500;600&display=swap" rel="stylesheet"><style>
:root{--gold:#f1d291;--wine:#420717}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#26030c;color:var(--gold);font-family:Georgia,serif}button{font:inherit}main{position:relative;width:100%;height:100dvh;overflow-y:hidden;overflow-x:hidden;overscroll-behavior-y:contain;scroll-snap-type:none;scroll-behavior:auto;touch-action:none}.page{position:relative;display:flex;align-items:center;justify-content:center;width:100vw;height:100dvh;min-height:100dvh;flex-shrink:0;background:#400815;overflow:hidden}.page:not(.doors):not(.countpage){padding:0;margin:0;border:0}.art{position:absolute;inset:0;display:block;width:100%;height:100%;min-width:100%;min-height:100%;max-width:none;max-height:none;object-fit:cover;object-position:50% 50%;background:#370716}.page:not(.countpage) .art{filter:saturate(1.04)}.countpage{background:radial-gradient(ellipse at center,#720c20,#3b0311 75%)}.countwrap{height:min(93dvh,900px);width:min(94vw,560px);border:1.5px solid #e8bf79;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 12px;gap:clamp(24px,5vh,50px)}.countwrap:before{content:'';position:absolute;inset:7px;border:1px solid #a97948;pointer-events:none}.counttitle{font-family:'Great Vibes',cursive;font-size:clamp(46px,11vw,75px);text-align:center;line-height:1.2;text-shadow:0 2px 7px #0008}.counttitle small{display:block;font-size:.62em}.countgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(5px,1.7vw,12px);width:100%}.timebox{border:1px solid #edc77e;border-radius:9px;min-width:0;text-align:center;padding:15px 2px}.timebox strong{display:block;font:clamp(22px,7vw,45px) Georgia,serif}.timebox span{font:clamp(8px,2vw,12px) Cinzel,serif;letter-spacing:.02em}.countdate{font:clamp(17px,5vw,28px) Cinzel,serif;text-align:center}.doors{background:#200409}.door-half{position:absolute;top:0;bottom:0;width:50%;background-image:url('assets/doors.jpg');background-size:200% 100%;transition:transform 2.7s cubic-bezier(.55,.02,.2,1);box-shadow:inset 0 0 30px #0008}.leftdoor{left:0;background-position:left}.rightdoor{right:0;background-position:right}.doors.opened .leftdoor{transform:translateX(-103%)}.doors.opened .rightdoor{transform:translateX(103%)}.doorlabel{position:absolute;left:50%;bottom:14%;transform:translateX(-50%);background:#3b0917db;border:1px solid var(--gold);border-radius:30px;color:var(--gold);padding:13px 25px;white-space:nowrap;letter-spacing:.15em;font:13px Cinzel,serif;z-index:2;cursor:pointer}.doors.opened .doorlabel{opacity:0;pointer-events:none}.dust{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}.particle{position:absolute;top:-8vh;left:var(--x);width:var(--size);height:var(--size);border-radius:70% 15% 75% 20%;background:#b94b67;opacity:.4;animation:fall var(--duration) linear var(--delay) infinite}.particle.gold{border-radius:50%;background:#ffe5a1;box-shadow:0 0 7px #eebf68}.countpage .particle{display:none}@keyframes fall{to{transform:translate3d(38px,115vh,0) rotate(440deg)}}.nav{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;z-index:8;background:#300717cc;border:1px solid #d7ad7288;border-radius:40px;padding:5px 10px;backdrop-filter:blur(6px)}.nav[hidden]{display:none}.nav button{width:38px;height:38px;border:1px solid #d7ad72;border-radius:50%;background:#4b1020;color:var(--gold);font-size:20px;cursor:pointer}.nav span{font:12px Cinzel,serif;min-width:48px;text-align:center}.swipe{position:absolute;bottom:70px;color:#f6d8a6aa;font:10px Cinzel,serif;letter-spacing:.15em;z-index:3;text-align:center;width:100%;pointer-events:none}@keyframes hint{to{opacity:.3;transform:translateY(-7px)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><main aria-label="Attinder and Ruchi wedding invitation">
<section class="page doors active" aria-label="Tap to open"><div class="door-half leftdoor"></div><div class="door-half rightdoor"></div><button class="doorlabel" id="open">TAP TO OPEN</button></section>
<section class="page" aria-label="Family welcome"><img class="art" src="assets/welcome.jpg" alt="Couple and family welcome" loading="eager"></section>
<section class="page" aria-label="Family introduction"><img class="art" src="assets/family.jpg" alt="Wedding invitation family introduction" loading="lazy"></section>
<section class="page countpage" aria-label="Live wedding countdown"><div class="countwrap"><div class="counttitle"><small>Countdown to the</small>Big Day</div><div class="countgrid" id="clock"><div class="timebox"><strong id="days">--</strong><span>Days</span></div><div class="timebox"><strong id="hours">--</strong><span>Hours</span></div><div class="timebox"><strong id="minutes">--</strong><span>Minutes</span></div><div class="timebox"><strong id="seconds">--</strong><span>Seconds</span></div></div><div class="countdate">21 February 2027</div></div></section>
<section class="page" aria-label="Arambh of Sri Akhand Path Sahib"><img class="art" src="assets/arambh.jpg" alt="Arambh of Sri Akhand Path Sahib, 17 February 2027, 10 AM, Kamrai" loading="lazy"></section>
<section class="page" aria-label="Bhog of Sri Akhand Path Sahib"><img class="art" src="assets/bhog.jpg" alt="Bhog of Sri Akhand Path Sahib, 19 February 2027, 10 AM, Kamrai" loading="lazy"></section>
<section class="page" aria-label="Jaago"><img class="art" src="assets/jaago.jpg" alt="Jaago, 19 February 2027, 5 PM, Kamrai" loading="lazy"></section>
<section class="page" aria-label="Haldi and Mehndi"><img class="art" src="assets/haldi.jpg" alt="Haldi and Mehndi, 20 February 2027, 2 PM, Kamrai" loading="lazy"></section>
<section class="page" aria-label="Anand Karaj"><img class="art" src="assets/anand.jpg" alt="Anand Karaj, 21 February 2027, 11 AM, Jalandhar" loading="lazy"></section>
<section class="page" aria-label="Thank you"><img class="art" src="assets/thanks.jpg" alt="Thank you from the families of Attinder and Ruchi" loading="lazy"></section>
<div class="dust" id="dust" aria-hidden="true"></div><div class="nav" id="nav" hidden><button id="prev" aria-label="Previous page">↑</button><span id="pagecount">1 / 10</span><button id="next" aria-label="Next page">↓</button></div></main>
<script>
const scroller=document.querySelector('main'),pages=[...document.querySelectorAll('.page')],nav=document.getElementById('nav'),counter=document.getElementById('pagecount');
let current=0,opened=false,opening=false,animating=false,autoFrame=0;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function updatePosition(){
  current=Math.max(0,Math.min(pages.length-1,Math.round(scroller.scrollTop/scroller.clientHeight)));
  nav.hidden=!opened || opening;
  counter.textContent=`${current+1} / ${pages.length}`;
}
scroller.addEventListener('scroll',updatePosition,{passive:true});
// Only tap/buttons trigger an animated movement. Touch gestures never snap or glide.
function scrollToPage(i,duration=700){
  if(!opened||opening||i<1||i>=pages.length)return;
  cancelAnimationFrame(autoFrame);animating=true;
  const start=scroller.scrollTop,finish=i*scroller.clientHeight;
  if(reduced){scroller.scrollTop=finish;animating=false;return}
  const started=performance.now();
  function frame(now){
    const t=Math.min(1,(now-started)/duration);
    const ease=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
    scroller.scrollTop=start+(finish-start)*ease;
    if(t<1)autoFrame=requestAnimationFrame(frame);
    else{animating=false;updatePosition()}
  }
  autoFrame=requestAnimationFrame(frame);
}
// Manually track the finger and preserve the exact scroll position on release.
// No threshold, inertial fling, or automatic jump to another page.
let touching=false,lastY=0;
scroller.addEventListener('touchstart',e=>{
  if(!opened||opening||!e.touches.length)return;
  cancelAnimationFrame(autoFrame);animating=false;
  touching=true;lastY=e.touches[0].clientY;
},{passive:true});
scroller.addEventListener('touchmove',e=>{
  if(!opened||opening||!touching||!e.touches.length)return;
  if(e.cancelable)e.preventDefault();
  const y=e.touches[0].clientY;
  scroller.scrollTop+=(lastY-y);
  lastY=y;
},{passive:false});
scroller.addEventListener('touchend',()=>{touching=false;updatePosition()},{passive:true});
scroller.addEventListener('touchcancel',()=>{touching=false;updatePosition()},{passive:true});
// Mouse-wheel scrolling is continuous, without snapping.
scroller.addEventListener('wheel',e=>{
  if(!opened||opening)return;
  if(e.cancelable)e.preventDefault();
  cancelAnimationFrame(autoFrame);animating=false;
  scroller.scrollTop+=e.deltaY;
},{passive:false});
document.getElementById('open').addEventListener('click',()=>{
  if(opened||opening)return;
  opening=true;
  document.querySelector('.doors').classList.add('opened');
  // The doors open first. The welcome page then glides into view automatically.
  // Gesture control becomes available only once that reveal has finished.
  setTimeout(()=>{
    scroller.style.overflowY='auto';
    const start=scroller.scrollTop, finish=scroller.clientHeight;
    const duration=reduced?0:2600;
    const began=performance.now();
    const reveal=now=>{
      const t=duration?Math.min(1,(now-began)/duration):1;
      const ease=t*t*(3-2*t);
      scroller.scrollTop=start+(finish-start)*ease;
      if(t<1)autoFrame=requestAnimationFrame(reveal);
      else{
        scroller.scrollTop=finish;
        opening=false;
        opened=true;
        updatePosition();
      }
    };
    autoFrame=requestAnimationFrame(reveal);
  },reduced?200:2700);
});
document.getElementById('prev').addEventListener('click',()=>scrollToPage(Math.max(1,current-1)));
document.getElementById('next').addEventListener('click',()=>scrollToPage(current+1));
document.addEventListener('keydown',e=>{
  if(!opened||opening)return;
  if(e.key==='ArrowDown'||e.key==='PageDown'){e.preventDefault();scrollToPage(Math.min(current+1,pages.length-1))}
  if(e.key==='ArrowUp'||e.key==='PageUp'){e.preventDefault();scrollToPage(Math.max(current-1,1))}
});
updatePosition();
function tick(){let s=Math.max(0,Math.floor((new Date('2027-02-21T11:00:00+05:30').getTime()-Date.now())/1000));for(const [id,v] of [['days',Math.floor(s/86400)],['hours',Math.floor(s/3600)%24],['minutes',Math.floor(s/60)%60],['seconds',s%60]])document.getElementById(id).textContent=id==='days'?v:String(v).padStart(2,'0')}tick();setInterval(tick,1000);const layer=document.getElementById('dust');for(let i=0;i<29;i++){let p=document.createElement('i');p.className='particle'+(i%3===0?' gold':'');p.style.setProperty('--x',Math.random()*100+'%');p.style.setProperty('--size',(i%3===0?2+Math.random()*3:6+Math.random()*6)+'px');p.style.setProperty('--duration',(9+Math.random()*14)+'s');p.style.setProperty('--delay',(-Math.random()*22)+'s');layer.appendChild(p)}
</script></body></html>
